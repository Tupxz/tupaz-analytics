<!doctype html>
<!-- Plantilla de la imagen que aparece al compartir el enlace (1200 × 630).
     Se convierte en assets/img/og.png con una captura de pantalla de esta página a ese tamaño. -->
<html lang="es-CO">
<head>
<meta charset="utf-8">
<!-- Sitio en prueba: no aparece en buscadores. Quitar esta línea al lanzar. -->
<meta name="robots" content="noindex">
<title>Imagen para compartir · Tupaz Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Outfit:wght@800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #071A4A; color: #FFFFFF; font-family: "Inter", sans-serif; position: relative; }
  body::before { content: ""; position: absolute; inset: 0; background: radial-gradient(40% 55% at 82% 30%, rgba(47, 224, 138, .18), transparent 72%), radial-gradient(45% 60% at 10% 85%, rgba(142, 197, 255, .14), transparent 72%); }
  .fondo { position: absolute; left: 0; right: 0; bottom: 120px; height: 300px; }
  .fondo path { fill: none; vector-effect: non-scaling-stroke; }
  .texto { position: absolute; left: 72px; top: 64px; width: 640px; }
  .logo { display: block; height: 76px; width: auto; }
  h1 { margin: 58px 0 0; font: 800 76px/1.02 "Outfit", sans-serif; letter-spacing: -.03em; }
  h1 em { font-style: normal; color: #2FE08A; }
  .boton { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 6px; font: 800 26px "Outfit", sans-serif; color: #071A4A; }
  .boton span { background: #2FE08A; border-radius: 12px; padding: 18px 28px; }
  .boton i { background: #2FE08A; border-radius: 12px; width: 66px; display: grid; place-items: center; }
  .foto { position: absolute; right: 64px; top: 64px; width: 400px; height: 502px; object-fit: cover; border-radius: 36px; }
</style>
</head>
<body>
  <svg class="fondo" id="fondo" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true"></svg>
  <div class="texto">
    <svg class="logo" viewBox="0 0 264 56" aria-label="Tupaz Analytics · Economía y Datos">
      <polyline points="3,38 12,29 19,33 29,19 35,23 41,11" fill="none" stroke="#2FE08A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="41" cy="11" r="4.5" fill="#2FE08A"/>
      <text x="54" y="31" font-family="Outfit" font-weight="800" font-size="30" letter-spacing="-1"><tspan fill="#FFFFFF">Tupaz</tspan> <tspan fill="#2FE08A">Analytics</tspan></text>
      <text x="55" y="51" font-family="Inter" font-weight="500" font-size="13.5" fill="#DCE5FA">Economía y Datos</text>
    </svg>
    <h1>Sus datos, <em>al día</em> y sin copiar y pegar.</h1>
  </div>
  <div class="boton"><span>Escríbame por WhatsApp</span><i><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#071A4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M8 6h10v10"/></svg></i></div>
  <img class="foto" src="../assets/img/foto-768.webp" alt="">
  <script src="../assets/js/datos.js"></script>
  <script>
    // La tendencia real del desempleo de Medellín, muy tenue, como en el hero del sitio.
    (function () {
      var p = window.TUPAZ_DATOS.portada, n = p.v.length - 1, lo = Math.min.apply(null, p.v), hi = Math.max.apply(null, p.v);
      function ruta(v) { return v.map(function (x, k) { return (k ? 'L' : 'M') + (k / n * 1000).toFixed(1) + ' ' + (190 - (x - lo) / (hi - lo) * 175).toFixed(1); }).join(''); }
      document.getElementById('fondo').innerHTML = '<path d="' + ruta(p.v) + '" stroke="#8EC5FF" stroke-width="1.3" opacity=".12"/><path d="' + ruta(p.t) + '" stroke="#2FE08A" stroke-width="3.5" opacity=".22"/>';
    })();
  </script>
</body>
</html>
